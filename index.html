<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOMENAJE</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .instrucciones {
            background-color: #ffffff;
            padding: 15px 25px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 30px;
            text-align: center;
        }

        .tecla {
            background-color: #e0e0e0;
            padding: 4px 8px;
            border-radius: 4px;
            font-weight: bold;
            border: 1px solid #ccc;
        }

        .escenario {
            width: 320px;
            height: 380px;
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }

        .avatar {
            font-size: 100px;
            line-height: 1;
            margin-bottom: 20px;
            user-select: none;
            transition: transform 0.2s ease;
        }

        .mensaje {
            font-size: 22px;
            font-weight: bold;
            color: #555;
            text-align: center;
            padding: 0 10px;
        }

        /* Estilos para el estado Molesto (Tecla M) */
        .molesto {
            border: 4px solid #e74c3c;
            background-color: #fdf2f2;
        }
        .molesto .avatar {
            animation: temblor 0.2s infinite;
        }
        .molesto .mensaje {
            color: #c0392b;
        }

        /* Estilos para el estado Feliz (Tecla N) */
        .feliz {
            border: 4px solid #2ecc71;
            background-color: #f0fff4;
        }
        .feliz .avatar {
            animation: salto 0.5s ease infinite alternate;
        }
        .feliz .mensaje {
            color: #27ae60;
        }

        /* Animaciones */
        @keyframes temblor {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            20% { transform: translate(-2px, 0px) rotate(-2deg); }
            40% { transform: translate(2px, -1px) rotate(2deg); }
            60% { transform: translate(-1px, 2px) rotate(0deg); }
            80% { transform: translate(1px, -2px) rotate(1deg); }
            100% { transform: translate(1px, 1px) rotate(0deg); }
        }

        @keyframes salto {
            0% { transform: translateY(0); }
            100% { transform: translateY(-15px); }
        }
    </style>
</head>
<body>

    <h1>HOMENAJE</h1>

    <div class="instrucciones">
        <p>Presiona la tecla <span class="tecla">M</span> para mostrar el personaje <strong>Molesto</strong>.</p>
        <p>Presiona la tecla <span class="tecla">N</span> para mostrar el personaje <strong>Feliz</strong>.</p>
    </div>

    <div id="escenario" class="escenario">
        <div id="avatar" class="avatar">😐</div>
        <div id="mensaje" class="mensaje">Presiona M o N</div>
    </div>

    <script>
        const escenario = document.getElementById('escenario');
        const avatar = document.getElementById('avatar');
        const mensaje = document.getElementById('mensaje');

        document.addEventListener('keydown', function(event) {
            // Convertimos la tecla presionada a mayúscula para detectar tanto 'm' como 'M'
            const tecla = event.key.toUpperCase();

            if (tecla === 'M') {
                // Estado Molesto
                escenario.className = 'escenario molesto';
                avatar.textContent = '😡';
                mensaje.textContent = '¡Grrr! ¡Estoy muy molesto!';
            } else if (tecla === 'N') {
                // Estado Feliz
                escenario.className = 'escenario feliz';
                avatar.textContent = '😄';
                mensaje.textContent = '¡Qué alegría! ¡Estoy feliz!';
            }
        });
    </script>

</body>
</html>
