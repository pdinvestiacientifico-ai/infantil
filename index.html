<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cara Interactiva</title>
  <style>
    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      background-color: #1e1e2e;
      font-family: sans-serif;
      color: #ffffff;
    }

    .instructions {
      margin-bottom: 20px;
      font-size: 1.2rem;
      text-align: center;
    }

    .key {
      background: #313244;
      padding: 4px 10px;
      border-radius: 6px;
      border: 1px solid #45475a;
      font-weight: bold;
    }

    #face-container {
      width: 250px;
      height: 250px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>
<body>

  <div class="instructions">
    Presiona <span class="key">M</span> para ver la cara molesta <br><br>
    Presiona <span class="key">N</span> para ver la cara feliz
  </div>

  <div id="face-container">
    <!-- Cara Molesta (Con diente mordiendo el labio) -->
    <svg id="angry-face" viewBox="0 0 100 100" width="100%" height="100%">
      <!-- Cabeza -->
      <circle cx="50" cy="50" r="45" fill="#e74c3c" />
      <!-- Cejas molestas -->
      <line x1="20" y1="32" x2="42" y2="42" stroke="#2c3e50" stroke-width="5" stroke-linecap="round" />
      <line x1="80" y1="32" x2="58" y2="42" stroke="#2c3e50" stroke-width="5" stroke-linecap="round" />
      <!-- Ojos -->
      <circle cx="32" cy="48" r="5" fill="#2c3e50" />
      <circle cx="68" cy="48" r="5" fill="#2c3e50" />
      <!-- Boca mordiendo labio -->
      <path d="M 28 72 Q 50 62 72 72 Q 50 80 28 72 Z" fill="#c0392b" stroke="#2c3e50" stroke-width="2" />
      <!-- Diente mordiendo -->
      <rect x="44" y="66" width="8" height="7" fill="#ffffff" stroke="#2c3e50" stroke-width="1" rx="1" />
    </svg>

    <!-- Cara Feliz -->
    <svg id="happy-face" class="hidden" viewBox="0 0 100 100" width="100%" height="100%">
      <!-- Cabeza -->
      <circle cx="50" cy="50" r="45" fill="#f1c40f" />
      <!-- Ojos -->
      <circle cx="32" cy="40" r="6" fill="#2c3e50" />
      <circle cx="68" cy="40" r="6" fill="#2c3e50" />
      <!-- Sonrisa -->
      <path d="M 28 60 Q 50 85 72 60" fill="none" stroke="#2c3e50" stroke-width="5" stroke-linecap="round" />
    </svg>
  </div>

  <script>
    const angryFace = document.getElementById('angry-face');
    const happyFace = document.getElementById('happy-face');

    document.addEventListener('keydown', (event) => {
      const key = event.key.toLowerCase();
      
      if (key === 'm') {
        angryFace.classList.remove('hidden');
        happyFace.classList.add('hidden');
      } else if (key === 'n') {
        happyFace.classList.remove('hidden');
        angryFace.classList.add('hidden');
      }
    });
  </script>
</body>
</html>
