<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Holograma Chibi Interactivo</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #030712;
      font-family: 'Segoe UI', Roboto, sans-serif;
      color: #00f0ff;
      overflow: hidden;
    }

    .instructions {
      margin-bottom: 20px;
      font-size: 1.1rem;
      text-align: center;
      background: rgba(0, 240, 255, 0.05);
      padding: 12px 24px;
      border-radius: 12px;
      backdrop-filter: blur(10px);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.2);
      border: 1px solid rgba(0, 240, 255, 0.3);
      text-shadow: 0 0 5px #00f0ff;
    }

    .key {
      background: #00f0ff;
      color: #030712;
      padding: 4px 10px;
      border-radius: 6px;
      font-weight: bold;
      box-shadow: 0 0 10px #00f0ff;
    }

    #canvas-container {
      position: relative;
      width: 500px;
      height: 550px;
    }

    canvas {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <div class="instructions">
    Presiona <span class="key">M</span> para Holograma Chibi Molesto <br><br>
    Presiona <span class="key">N</span> para Holograma Chibi Feliz
  </div>

  <div id="canvas-container">
    <canvas id="holoCanvas" width="500" height="550"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('holoCanvas');
    const ctx = canvas.getContext('2d');

    let targetState = 'happy';
    let animProgress = 1; // 0 = Angry, 1 = Happy
    let eyeScaleY = 1;
    let blinkTimer = 0;
    let time = 0;

    document.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();
      if (key === 'm') targetState = 'angry';
      if (key === 'n') targetState = 'happy';
    });

    function lerp(start, end, amt) {
      return (1 - amt) * start + amt * end;
    }

    function update() {
      time += 0.04;

      if (targetState === 'happy' && animProgress < 1) {
        animProgress += 0.08;
        if (animProgress > 1) animProgress = 1;
      } else if (targetState === 'angry' && animProgress > 0) {
        animProgress -= 0.08;
        if (animProgress < 0) animProgress = 0;
      }

      // Parpadeo
      blinkTimer += 0.025;
      if (blinkTimer > 3) {
        eyeScaleY = Math.abs(Math.sin(blinkTimer * 12));
        if (blinkTimer > 3.25) blinkTimer = 0;
      } else {
        eyeScaleY = 1;
      }
    }

    function drawHologram() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Color dinámico de holograma (Cian para feliz, Magenta/Rojo para molesto)
      const mainHue = lerp(0, 180, animProgress); // 0 = Rojo/Rosa, 180 = Cian
      const holoColor = `hsl(${mainHue}, 100%, 60%)`;
      const holoGlow = `hsl(${mainHue}, 100%, 50%)`;

      const cx = canvas.width / 2;
      const cy = 200;
      const floatY = Math.sin(time * 2.5) * 6; // Flotación holográfica

      // --- 1. PROYECTOR BASE Y LUZ ---
      ctx.save();
      ctx.strokeStyle = holoColor;
      ctx.shadowColor = holoGlow;
      ctx.shadowBlur = 15;
      ctx.lineWidth = 2;

      // Haz de luz holográfica
      const lightGrad = ctx.createLinearGradient(cx, 480, cx, 100);
      lightGrad.addColorStop(0, `hsla(${mainHue}, 100%, 50%, 0.4)`);
      lightGrad.addColorStop(1, `hsla(${mainHue}, 100%, 50%, 0.0)`);
      ctx.fillStyle = lightGrad;
      ctx.beginPath();
      ctx.moveTo(cx - 140, 480);
      ctx.lineTo(cx + 140, 480);
      ctx.lineTo(cx + 180, 100);
      ctx.lineTo(cx - 180, 100);
      ctx.closePath();
      ctx.fill();

      // Elipse base del proyector
      ctx.beginPath();
      ctx.ellipse(cx, 480, 140, 30, 0, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();

      ctx.save();
      ctx.translate(0, floatY);
      ctx.strokeStyle = holoColor;
      ctx.shadowColor = holoGlow;
      ctx.shadowBlur = 12;
      ctx.lineWidth = 3;

      // --- 2. CUERPO INFANTIL (CHIBI: Brazos y Piernas) ---
      const bodyY = cy + 90;

      // Tronco Chibi
      ctx.beginPath();
      ctx.roundRect(cx - 30, bodyY, 60, 65, 15);
      ctx.stroke();

      // Brazos
      const armAngle = lerp(0.3, -0.2, animProgress);
      // Brazo Izquierdo
      ctx.beginPath();
      ctx.moveTo(cx - 30, bodyY + 10);
      ctx.lineTo(cx - 55, bodyY + 35 + Math.sin(time * 3) * 3);
      ctx.arc(cx - 57, bodyY + 37, 6, 0, Math.PI * 2); // Mano redondeada
      ctx.stroke();

      // Brazo Derecho
      ctx.beginPath();
      ctx.moveTo(cx + 30, bodyY + 10);
      ctx.lineTo(cx + 55, bodyY + 35 - Math.sin(time * 3) * 3);
      ctx.arc(cx + 57, bodyY + 37, 6, 0, Math.PI * 2);
      ctx.stroke();

      // Piernas Chibi cortas
      ctx.beginPath();
      ctx.moveTo(cx - 15, bodyY + 65);
      ctx.lineTo(cx - 18, bodyY + 95);
      ctx.arc(cx - 20, bodyY + 97, 7, 0, Math.PI * 2); // Pie
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(cx + 15, bodyY + 65);
      ctx.lineTo(cx + 18, bodyY + 95);
      ctx.arc(cx + 20, bodyY + 97, 7, 0, Math.PI * 2);
      ctx.stroke();

      // --- 3. CABEZA INFANTIL GRANDOTA (Chibi redonda) ---
      ctx.beginPath();
      ctx.ellipse(cx, cy, 95, 85, 0, 0, Math.PI * 2); // Forma de mejillas infladas
      ctx.stroke();

      // Cabello Holográfico
      ctx.beginPath();
      ctx.moveTo(cx - 90, cy - 20);
      ctx.quadraticCurveTo(cx - 40, cy - 90, cx, cy - 60);
      ctx.quadraticCurveTo(cx + 40, cy - 90, cx + 90, cy - 20);
      ctx.stroke();

      // Cejas
      const eyebrowY = lerp(cy - 35, cy - 45, animProgress);
      const eyebrowTilt = lerp(18, -4, animProgress);
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(cx - 65, eyebrowY - eyebrowTilt); ctx.lineTo(cx - 20, eyebrowY + eyebrowTilt);
      ctx.moveTo(cx + 20, eyebrowY + eyebrowTilt); ctx.lineTo(cx + 65, eyebrowY - eyebrowTilt);
      ctx.stroke();

      // --- 4. OJOS ANIME (CÓDIGO ORIGINAL CONSERVADO Y ADAPTADO) ---
      const eyeY = cy - 5;
      const eyeWidth = 22;
      const eyeHeight = lerp(30, 38, animProgress);

      [cx - 42, cx + 42].forEach((ex) => {
        ctx.save();
        ctx.translate(ex, eyeY);
        ctx.scale(1, eyeScaleY);

        // Base del ojo
        ctx.beginPath();
        ctx.ellipse(0, 0, eyeWidth, eyeHeight, 0, 0, Math.PI * 2);
        ctx.strokeStyle = holoColor;
        ctx.lineWidth = 2;
        ctx.stroke();

        // Iris
        ctx.beginPath();
        ctx.ellipse(0, 2, eyeWidth - 5, eyeHeight - 7, 0, 0, Math.PI * 2);
        ctx.stroke();

        // Pupila
        ctx.beginPath();
        ctx.ellipse(0, 4, 6, 10, 0, 0, Math.PI * 2);
        ctx.fillStyle = holoColor;
        ctx.fill();

        // Brillos Anime
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(-6, -8, 5, 0, Math.PI * 2);
        ctx.arc(5, 8, 2.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();

        // Pestaña superior
        ctx.beginPath();
        ctx.lineWidth = 4;
        ctx.arc(ex, eyeY - eyeHeight * eyeScaleY + 6, eyeWidth + 2, Math.PI * 1.1, Math.PI * 1.9);
        ctx.stroke();
      });

      // --- 5. BOCA Y DIENTE MORDIENDO ---
      const mouthY = cy + 42;

      if (animProgress < 0.5) {
        // MODO MOLESTO: Boca apretada con diente afilado
        const shake = Math.sin(time * 30) * 1.5;

        ctx.beginPath();
        ctx.moveTo(cx - 25 + shake, mouthY);
        ctx.lineTo(cx + 25 + shake, mouthY + 3);
        ctx.lineTo(cx + 15 + shake, mouthY + 16);
        ctx.lineTo(cx - 20 + shake, mouthY + 14);
        ctx.closePath();
        ctx.stroke();

        // Diente Anime mordiendo el labio
        ctx.beginPath();
        ctx.moveTo(cx - 8 + shake, mouthY);
        ctx.lineTo(cx - 1 + shake, mouthY);
        ctx.lineTo(cx - 4 + shake, mouthY + 11);
        ctx.closePath();
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.stroke();
      } else {
        // MODO FELIZ: Sonrisa Chibi pequeña y tierna
        ctx.beginPath();
        ctx.arc(cx, mouthY - 5, 20, 0.2 * Math.PI, 0.8 * Math.PI, false);
        ctx.lineWidth = 3.5;
        ctx.stroke();
      }

      ctx.restore();

      // --- 6. EFECTO LINEAS DE ESCANEO HOLOGRÁFICAS ---
      ctx.fillStyle = `rgba(0, 0, 0, 0.15)`;
      for (let i = 0; i < canvas.height; i += 4) {
        ctx.fillRect(0, i, canvas.width, 2);
      }
    }

    function loop() {
      update();
      drawHologram();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
