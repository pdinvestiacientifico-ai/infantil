<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Homenaje Holográfico</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #02050e;
      font-family: 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* Resplandor del holograma que cubre TODA la página */
    .full-page-glow {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      transition: background 0.5s ease;
      z-index: 1;
    }

    /* Texto Único: HOMENAJE */
    .title {
      position: absolute;
      top: 40px;
      font-size: 2.8rem;
      font-weight: 900;
      letter-spacing: 8px;
      text-transform: uppercase;
      transition: color 0.5s ease, text-shadow 0.5s ease;
      z-index: 10;
    }

    #canvas-container {
      position: relative;
      width: 600px;
      height: 700px;
      z-index: 5;
    }

    canvas {
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>

  <div id="glow" class="full-page-glow"></div>
  <div id="title" class="title">HOMENAJE</div>

  <div id="canvas-container">
    <canvas id="holoCanvas" width="600" height="700"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('holoCanvas');
    const ctx = canvas.getContext('2d');
    const glowElem = document.getElementById('glow');
    const titleElem = document.getElementById('title');

    let targetState = 'happy';
    let animProgress = 1; // 0 = Angry, 1 = Happy
    let eyeScaleY = 1;
    let blinkTimer = 0;
    let time = 0;

    // Partículas ambientales de holograma
    const particles = Array.from({ length: 45 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      size: Math.random() * 2.5 + 1,
      speedY: Math.random() * 1.5 + 0.5,
      alpha: Math.random()
    }));

    document.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();
      if (key === 'm') targetState = 'angry';
      if (key === 'n') targetState = 'happy';
    });

    function lerp(start, end, amt) {
      return (1 - amt) * start + amt * end;
    }

    function update() {
      time += 0.04;

      if (targetState === 'happy' && animProgress < 1) {
        animProgress += 0.06;
        if (animProgress > 1) animProgress = 1;
      } else if (targetState === 'angry' && animProgress > 0) {
        animProgress -= 0.06;
        if (animProgress < 0) animProgress = 0;
      }

      // Parpadeo
      blinkTimer += 0.025;
      if (blinkTimer > 3) {
        eyeScaleY = Math.abs(Math.sin(blinkTimer * 12));
        if (blinkTimer > 3.25) blinkTimer = 0;
      } else {
        eyeScaleY = 1;
      }

      // Animación de partículas
      particles.forEach(p => {
        p.y -= p.speedY;
        if (p.y < 0) {
          p.y = canvas.height;
          p.x = Math.random() * canvas.width;
        }
      });
    }

    function drawRealHologram() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const mainHue = lerp(340, 185, animProgress); // Magenta/Rojo para M, Cian para N
      const holoColor = `hsl(${mainHue}, 100%, 65%)`;
      const holoGlow = `hsl(${mainHue}, 100%, 50%)`;

      // --- 1. LUZ COMPLETA DE PÁGINA (CSS DYNAMIC GLOW) ---
      glowElem.style.background = `radial-gradient(circle at 50% 60%, hsla(${mainHue}, 100%, 45%, 0.28) 0%, hsla(${mainHue}, 100%, 15%, 0.08) 60%, transparent 100%)`;
      titleElem.style.color = holoColor;
      titleElem.style.textShadow = `0 0 15px ${holoGlow}, 0 0 30px ${holoGlow}`;

      const cx = canvas.width / 2;
      const cy = 240;
      const floatY = Math.sin(time * 2) * 8; // Flotación realista

      // --- 2. HAZ DE LUZ HOLOGRÁFICO PRINCIPAL ---
      const beamGrad = ctx.createLinearGradient(cx, 620, cx, 50);
      beamGrad.addColorStop(0, `hsla(${mainHue}, 100%, 50%, 0.45)`);
      beamGrad.addColorStop(0.7, `hsla(${mainHue}, 100%, 50%, 0.12)`);
      beamGrad.addColorStop(1, `hsla(${mainHue}, 100%, 50%, 0.0)`);

      ctx.fillStyle = beamGrad;
      ctx.beginPath();
      ctx.moveTo(cx - 240, 620);
      ctx.lineTo(cx + 240, 620);
      ctx.lineTo(cx + 200, 50);
      ctx.lineTo(cx - 200, 50);
      ctx.closePath();
      ctx.fill();

      // Partículas flotando en el haz
      particles.forEach(p => {
        ctx.fillStyle = `hsla(${mainHue}, 100%, 75%, ${p.alpha})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      });

      // --- 3. PERSONAJE REALISTA HOLOGRÁFICO ---
      ctx.save();
      ctx.translate(0, floatY);
      ctx.strokeStyle = holoColor;
      ctx.shadowColor = holoGlow;
      ctx.shadowBlur = 18;
      ctx.lineWidth = 2.5;

      const bodyY = cy + 100;

      // -- TORSO REALISTA --
      ctx.beginPath();
      ctx.moveTo(cx - 45, bodyY); // Hombro izq
      ctx.lineTo(cx + 45, bodyY); // Hombro der
      ctx.lineTo(cx + 35, bodyY + 120); // Cintura der
      ctx.lineTo(cx - 35, bodyY + 120); // Cintura izq
      ctx.closePath();
      ctx.stroke();

      // Cuello
      ctx.beginPath();
      ctx.moveTo(cx - 15, bodyY); ctx.lineTo(cx - 15, cy + 85);
      ctx.moveTo(cx + 15, bodyY); ctx.lineTo(cx + 15, cy + 85);
      ctx.stroke();

      // -- BRAZOS REALISTAS CON ARTICULACIONES --
      // Brazo Izquierdo
      ctx.beginPath();
      ctx.moveTo(cx - 45, bodyY);
      ctx.lineTo(cx - 75, bodyY + 65); // Codo
      ctx.lineTo(cx - 85, bodyY + 125); // Muñeca y Mano
      ctx.arc(cx - 87, bodyY + 128, 5, 0, Math.PI * 2);
      ctx.stroke();

      // Brazo Derecho
      ctx.beginPath();
      ctx.moveTo(cx + 45, bodyY);
      ctx.lineTo(cx + 75, bodyY + 65);
      ctx.lineTo(cx + 85, bodyY + 125);
      ctx.arc(cx + 87, bodyY + 128, 5, 0, Math.PI * 2);
      ctx.stroke();

      // -- PIERNAS REALISTAS --
      // Pierna Izquierda
      ctx.beginPath();
      ctx.moveTo(cx - 25, bodyY + 120);
      ctx.lineTo(cx - 30, bodyY + 200); // Rodilla
      ctx.lineTo(cx - 32, bodyY + 280); // Tobillo
      ctx.stroke();

      // Pierna Derecha
      ctx.beginPath();
      ctx.moveTo(cx + 25, bodyY + 120);
      ctx.lineTo(cx + 30, bodyY + 200);
      ctx.lineTo(cx + 32, bodyY + 280);
      ctx.stroke();

      // -- CABEZA ANATÓMICA PROPORCIONAL --
      ctx.beginPath();
      ctx.moveTo(cx - 60, cy - 30);
      ctx.quadraticCurveTo(cx - 65, cy + 40, cx - 25, cy + 80);
      ctx.lineTo(cx, cy + 90); // Mentón
      ctx.lineTo(cx + 25, cy + 80);
      ctx.quadraticCurveTo(cx + 65, cy + 40, cx + 60, cy - 30);
      ctx.quadraticCurveTo(cx, cy - 100, cx - 60, cy - 30);
      ctx.stroke();

      // Cabello estilizado
      ctx.beginPath();
      ctx.moveTo(cx - 60, cy - 30);
      ctx.quadraticCurveTo(cx - 30, cy - 95, cx, cy - 70);
      ctx.quadraticCurveTo(cx + 30, cy - 95, cx + 60, cy - 30);
      ctx.stroke();

      // Cejas
      const eyebrowY = lerp(cy - 25, cy - 35, animProgress);
      const eyebrowTilt = lerp(20, -5, animProgress);
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.moveTo(cx - 50, eyebrowY - eyebrowTilt); ctx.lineTo(cx - 15, eyebrowY + eyebrowTilt);
      ctx.moveTo(cx + 15, eyebrowY + eyebrowTilt); ctx.lineTo(cx + 50, eyebrowY - eyebrowTilt);
      ctx.stroke();

      // --- 4. OJOS ANIME ORIGINALES (CONSERVADOS) ---
      const eyeY = cy - 2;
      const eyeWidth = 20;
      const eyeHeight = lerp(28, 36, animProgress);

      [cx - 32, cx + 32].forEach((ex) => {
        ctx.save();
        ctx.translate(ex, eyeY);
        ctx.scale(1, eyeScaleY);

        ctx.beginPath();
        ctx.ellipse(0, 0, eyeWidth, eyeHeight, 0, 0, Math.PI * 2);
        ctx.strokeStyle = holoColor;
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.beginPath();
        ctx.ellipse(0, 2, eyeWidth - 5, eyeHeight - 7, 0, 0, Math.PI * 2);
        ctx.stroke();

        ctx.beginPath();
        ctx.ellipse(0, 4, 5, 9, 0, 0, Math.PI * 2);
        ctx.fillStyle = holoColor;
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(-5, -7, 4.5, 0, Math.PI * 2);
        ctx.arc(4, 7, 2, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();

        ctx.beginPath();
        ctx.lineWidth = 4;
        ctx.arc(ex, eyeY - eyeHeight * eyeScaleY + 5, eyeWidth + 2, Math.PI * 1.1, Math.PI * 1.9);
        ctx.stroke();
      });

      // --- 5. BOCA Y DIENTE MORDIENDO ANIME ---
      const mouthY = cy + 45;

      if (animProgress < 0.5) {
        const shake = Math.sin(time * 30) * 1.5;

        ctx.beginPath();
        ctx.moveTo(cx - 22 + shake, mouthY);
        ctx.lineTo(cx + 22 + shake, mouthY + 3);
        ctx.lineTo(cx + 14 + shake, mouthY + 16);
        ctx.lineTo(cx - 18 + shake, mouthY + 14);
        ctx.closePath();
        ctx.stroke();

        // Diente mordiendo labio
        ctx.beginPath();
        ctx.moveTo(cx - 7 + shake, mouthY);
        ctx.lineTo(cx - 1 + shake, mouthY);
        ctx.lineTo(cx - 4 + shake, mouthY + 11);
        ctx.closePath();
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.arc(cx, mouthY - 5, 18, 0.2 * Math.PI, 0.8 * Math.PI, false);
        ctx.lineWidth = 3;
        ctx.stroke();
      }

      ctx.restore();

      // --- 6. LINEAS DE ESCANEO HOLOGRÁFICAS ---
      ctx.fillStyle = `rgba(0, 0, 0, 0.18)`;
      for (let i = 0; i < canvas.height; i += 4) {
        ctx.fillRect(0, i, canvas.width, 2);
      }
    }

    function loop() {
      update();
      drawRealHologram();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
