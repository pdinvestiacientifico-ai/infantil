<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Palacio del Rey Agüero - Súper Holograma</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      background: transparent !important;
      font-family: 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* Resplandor holográfico ambiental transparente en toda la pantalla */
    .full-page-glow {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      transition: background 0.4s ease;
      z-index: 2;
      mix-blend-mode: screen;
    }

    /* Título Súper Holográfico */
    .title {
      position: absolute;
      top: 30px;
      width: 100%;
      text-align: center;
      font-size: 3.5rem;
      font-weight: 900;
      letter-spacing: 12px;
      text-transform: uppercase;
      transition: color 0.4s ease, text-shadow 0.4s ease;
      z-index: 10;
      pointer-events: none;
    }

    #canvas-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      z-index: 5;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: transparent;
    }
  </style>
</head>
<body>

  <div id="glow" class="full-page-glow"></div>
  <div id="title" class="title">HOMENAJE</div>

  <div id="canvas-container">
    <canvas id="holoCanvas"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('holoCanvas');
    const ctx = canvas.getContext('2d');
    const glowElem = document.getElementById('glow');
    const titleElem = document.getElementById('title');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let targetState = 'happy';
    let animProgress = 1; // 0 = Angry, 1 = Happy
    let eyeScaleY = 1;
    let blinkTimer = 0;
    let time = 0;

    // Partículas holográficas para llenar toda la pantalla
    const particleCount = 120;
    const particles = Array.from({ length: particleCount }, () => ({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      size: Math.random() * 3 + 1,
      speedY: Math.random() * 1.8 + 0.5,
      speedX: (Math.random() - 0.5) * 0.8,
      alpha: Math.random()
    }));

    document.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();
      if (key === 'm') targetState = 'angry';
      if (key === 'n') targetState = 'happy';
    });

    function lerp(start, end, amt) {
      return (1 - amt) * start + amt * end;
    }

    function update() {
      time += 0.04;

      if (targetState === 'happy' && animProgress < 1) {
        animProgress += 0.06;
        if (animProgress > 1) animProgress = 1;
      } else if (targetState === 'angry' && animProgress > 0) {
        animProgress -= 0.06;
        if (animProgress < 0) animProgress = 0;
      }

      blinkTimer += 0.025;
      if (blinkTimer > 3) {
        eyeScaleY = Math.abs(Math.sin(blinkTimer * 12));
        if (blinkTimer > 3.25) blinkTimer = 0;
      } else {
        eyeScaleY = 1;
      }

      particles.forEach(p => {
        p.y -= p.speedY;
        p.x += p.speedX;
        if (p.y < 0) {
          p.y = canvas.height;
          p.x = Math.random() * canvas.width;
        }
        if (p.x < 0) p.x = canvas.width;
        if (p.x > canvas.width) p.x = 0;
      });
    }

    function drawScene() {
      // Limpieza total del lienzo para asegurar fondo 100% transparente
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const mainHue = lerp(340, 185, animProgress);
      const holoColor = `hsl(${mainHue}, 100%, 65%)`;
      const holoGlow = `hsl(${mainHue}, 100%, 50%)`;

      // Resplandor difuso ambiental en los bordes de la pantalla
      glowElem.style.background = `radial-gradient(circle at 50% 50%, hsla(${mainHue}, 100%, 50%, 0.18) 0%, hsla(${mainHue}, 100%, 30%, 0.05) 70%, transparent 100%)`;
      titleElem.style.color = holoColor;
      titleElem.style.textShadow = `0 0 20px ${holoGlow}, 0 0 40px ${holoGlow}, 0 0 60px ${holoGlow}`;

      const cx = canvas.width / 2;
      const cy = canvas.height * 0.38;
      const floatY = Math.sin(time * 2) * 10;

      // 1. Haz de Luz Holográfico Gigante (Proyector Base)
      const beamGrad = ctx.createLinearGradient(cx, canvas.height, cx, cy - 120);
      beamGrad.addColorStop(0, `hsla(${mainHue}, 100%, 55%, 0.45)`);
      beamGrad.addColorStop(0.5, `hsla(${mainHue}, 100%, 50%, 0.15)`);
      beamGrad.addColorStop(1, `hsla(${mainHue}, 100%, 50%, 0.0)`);

      ctx.fillStyle = beamGrad;
      ctx.beginPath();
      ctx.moveTo(cx - 380, canvas.height);
      ctx.lineTo(cx + 380, canvas.height);
      ctx.lineTo(cx + 200, cy - 120);
      ctx.lineTo(cx - 200, cy - 120);
      ctx.closePath();
      ctx.fill();

      // 2. Partículas Holográficas Ambientalizadas
      particles.forEach(p => {
        ctx.fillStyle = `hsla(${mainHue}, 100%, 75%, ${p.alpha})`;
        ctx.shadowColor = holoGlow;
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      });

      // 3. Renderizado de la Entidad Holográfica
      ctx.save();
      ctx.translate(0, floatY);
      ctx.strokeStyle = holoColor;
      ctx.shadowColor = holoGlow;
      ctx.shadowBlur = 25;
      ctx.lineWidth = 3;

      const bodyY = cy + 100;

      // Torso
      ctx.beginPath();
      ctx.moveTo(cx - 45, bodyY); ctx.lineTo(cx + 45, bodyY);
      ctx.lineTo(cx + 35, bodyY + 120); ctx.lineTo(cx - 35, bodyY + 120);
      ctx.closePath();
      ctx.stroke();

      // Cuello
      ctx.beginPath();
      ctx.moveTo(cx - 15, bodyY); ctx.lineTo(cx - 15, cy + 85);
      ctx.moveTo(cx + 15, bodyY); ctx.lineTo(cx + 15, cy + 85);
      ctx.stroke();

      // Brazos
      ctx.beginPath();
      ctx.moveTo(cx - 45, bodyY); ctx.lineTo(cx - 75, bodyY + 65);
      ctx.lineTo(cx - 85, bodyY + 125); ctx.arc(cx - 87, bodyY + 128, 5, 0, Math.PI * 2);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(cx + 45, bodyY); ctx.lineTo(cx + 75, bodyY + 65);
      ctx.lineTo(cx + 85, bodyY + 125); ctx.arc(cx + 87, bodyY + 128, 5, 0, Math.PI * 2);
      ctx.stroke();

      // Piernas
      ctx.beginPath();
      ctx.moveTo(cx - 25, bodyY + 120); ctx.lineTo(cx - 30, bodyY + 200); ctx.lineTo(cx - 32, bodyY + 280);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(cx + 25, bodyY + 120); ctx.lineTo(cx + 30, bodyY + 200); ctx.lineTo(cx + 32, bodyY + 280);
      ctx.stroke();

      // Cabeza
      ctx.beginPath();
      ctx.moveTo(cx - 60, cy - 30);
      ctx.quadraticCurveTo(cx - 65, cy + 40, cx - 25, cy + 80);
      ctx.lineTo(cx, cy + 90); ctx.lineTo(cx + 25, cy + 80);
      ctx.quadraticCurveTo(cx + 65, cy + 40, cx + 60, cy - 30);
      ctx.quadraticCurveTo(cx, cy - 100, cx - 60, cy - 30);
      ctx.stroke();

      // Cabello
      ctx.beginPath();
      ctx.moveTo(cx - 60, cy - 30);
      ctx.quadraticCurveTo(cx - 30, cy - 95, cx, cy - 70);
      ctx.quadraticCurveTo(cx + 30, cy - 95, cx + 60, cy - 30);
      ctx.stroke();

      // Cejas
      const eyebrowY = lerp(cy - 25, cy - 35, animProgress);
      const eyebrowTilt = lerp(20, -5, animProgress);
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(cx - 50, eyebrowY - eyebrowTilt); ctx.lineTo(cx - 15, eyebrowY + eyebrowTilt);
      ctx.moveTo(cx + 15, eyebrowY + eyebrowTilt); ctx.lineTo(cx + 50, eyebrowY - eyebrowTilt);
      ctx.stroke();

      // Ojos
      const eyeY = cy - 2;
      const eyeWidth = 20;
      const eyeHeight = lerp(28, 36, animProgress);

      [cx - 32, cx + 32].forEach((ex) => {
        ctx.save();
        ctx.translate(ex, eyeY);
        ctx.scale(1, eyeScaleY);

        ctx.beginPath();
        ctx.ellipse(0, 0, eyeWidth, eyeHeight, 0, 0, Math.PI * 2);
        ctx.strokeStyle = holoColor;
        ctx.lineWidth = 2.5;
        ctx.stroke();

        ctx.beginPath();
        ctx.ellipse(0, 2, eyeWidth - 5, eyeHeight - 7, 0, 0, Math.PI * 2);
        ctx.stroke();

        ctx.beginPath();
        ctx.ellipse(0, 4, 5, 9, 0, 0, Math.PI * 2);
        ctx.fillStyle = holoColor;
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(-5, -7, 4.5, 0, Math.PI * 2);
        ctx.arc(4, 7, 2, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();

        ctx.beginPath();
        ctx.lineWidth = 4;
        ctx.arc(ex, eyeY - eyeHeight * eyeScaleY + 5, eyeWidth + 2, Math.PI * 1.1, Math.PI * 1.9);
        ctx.stroke();
      });

      // Boca
      const mouthY = cy + 45;
      if (animProgress < 0.5) {
        const shake = Math.sin(time * 30) * 1.5;

        ctx.beginPath();
        ctx.moveTo(cx - 22 + shake, mouthY);
        ctx.lineTo(cx + 22 + shake, mouthY + 3);
        ctx.lineTo(cx + 14 + shake, mouthY + 16);
        ctx.lineTo(cx - 18 + shake, mouthY + 14);
        ctx.closePath();
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(cx - 7 + shake, mouthY);
        ctx.lineTo(cx - 1 + shake, mouthY);
        ctx.lineTo(cx - 4 + shake, mouthY + 11);
        ctx.closePath();
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.arc(cx, mouthY - 5, 18, 0.2 * Math.PI, 0.8 * Math.PI, false);
        ctx.lineWidth = 3.5;
        ctx.stroke();
      }

      ctx.restore();

      // 4. Efectos de Líneas de Escaneo e Interferencia Súper Holográfica
      ctx.shadowBlur = 0;
      ctx.fillStyle = `rgba(0, 255, 255, 0.04)`;
      for (let i = 0; i < canvas.height; i += 3) {
        ctx.fillRect(0, i, canvas.width, 1);
      }

      // Desplazamiento aleatorio tipo Glitch de pantalla holográfica
      if (Math.random() < 0.12) {
        const glitchY = Math.random() * canvas.height;
        const glitchHeight = Math.random() * 15 + 2;
        const glitchOffset = (Math.random() - 0.5) * 20;
        ctx.fillStyle = `hsla(${mainHue}, 100%, 70%, 0.15)`;
        ctx.fillRect(glitchOffset, glitchY, canvas.width, glitchHeight);
      }
    }

    function loop() {
      update();
      drawScene();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
