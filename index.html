<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Palacio del Rey Agüero - Homenaje Infantil</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100vw;
      height: 100vh;
      background: transparent !important;
      font-family: 'Comic Sans MS', 'Fredoka', 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* Resplandor holográfico ambiental en toda la pantalla */
    .full-page-glow {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      transition: background 0.4s ease;
      z-index: 2;
      mix-blend-mode: screen;
    }

    /* Título HOMENAJE: Totalmente Estático, Visible e Infantil */
    .title {
      position: absolute;
      top: 25px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 3.8rem;
      font-weight: 900;
      letter-spacing: 8px;
      text-transform: uppercase;
      color: #00ffff;
      text-shadow: 
        0 0 10px #00ffff,
        0 0 20px #00ffff,
        0 0 30px #ff00de,
        0 0 40px #ff00de;
      z-index: 10;
      pointer-events: none;
      white-space: nowrap;
      user-select: none;
    }

    #canvas-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      z-index: 5;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      background: transparent;
    }
  </style>
</head>
<body>

  <div id="glow" class="full-page-glow"></div>
  <div id="title" class="title">HOMENAJE</div>

  <div id="canvas-container">
    <canvas id="holoCanvas"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('holoCanvas');
    const ctx = canvas.getContext('2d');
    const glowElem = document.getElementById('glow');
    const titleElem = document.getElementById('title');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let targetState = 'happy';
    let animProgress = 1; // 0 = Angry, 1 = Happy
    let eyeScaleY = 1;
    let blinkTimer = 0;
    let time = 0;

    // Partículas en forma de estrellas y chispas infantiles
    const particleCount = 70;
    const particles = Array.from({ length: particleCount }, () => ({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      size: Math.random() * 4 + 2,
      speedY: Math.random() * 1.5 + 0.5,
      speedX: (Math.random() - 0.5) * 0.6,
      rot: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.05,
      alpha: Math.random() * 0.7 + 0.3
    }));

    document.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();
      if (key === 'm') targetState = 'angry';
      if (key === 'n') targetState = 'happy';
    });

    function lerp(start, end, amt) {
      return (1 - amt) * start + amt * end;
    }

    function update() {
      time += 0.04;

      if (targetState === 'happy' && animProgress < 1) {
        animProgress += 0.06;
        if (animProgress > 1) animProgress = 1;
      } else if (targetState === 'angry' && animProgress > 0) {
        animProgress -= 0.06;
        if (animProgress < 0) animProgress = 0;
      }

      blinkTimer += 0.025;
      if (blinkTimer > 3) {
        eyeScaleY = Math.abs(Math.sin(blinkTimer * 12));
        if (blinkTimer > 3.25) blinkTimer = 0;
      } else {
        eyeScaleY = 1;
      }

      particles.forEach(p => {
        p.y -= p.speedY;
        p.x += p.speedX;
        p.rot += p.rotSpeed;
        if (p.y < -20) {
          p.y = canvas.height + 20;
          p.x = Math.random() * canvas.width;
        }
        if (p.x < 0) p.x = canvas.width;
        if (p.x > canvas.width) p.x = 0;
      });
    }

    // Dibujar estrella infantil
    function drawStar(cx, cy, spikes, outerRadius, innerRadius, color) {
      let rot = Math.PI / 2 * 3;
      let x = cx;
      let y = cy;
      let step = Math.PI / spikes;

      ctx.beginPath();
      ctx.moveTo(cx, cy - outerRadius);
      for (let i = 0; i < spikes; i++) {
        x = cx + Math.cos(rot) * outerRadius;
        y = cy + Math.sin(rot) * outerRadius;
        ctx.lineTo(x, y);
        rot += step;

        x = cx + Math.cos(rot) * innerRadius;
        y = cy + Math.sin(rot) * innerRadius;
        ctx.lineTo(x, y);
        rot += step;
      }
      ctx.lineTo(cx, cy - outerRadius);
      ctx.closePath();
      ctx.fillStyle = color;
      ctx.fill();
    }

    function drawScene() {
      // Limpieza del lienzo para mantener fondo 100% transparente
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const mainHue = lerp(340, 190, animProgress);
      const holoColor = `hsl(${mainHue}, 100%, 70%)`;
      const holoGlow = `hsl(${mainHue}, 100%, 55%)`;

      // Resplandor difuso ambiental
      glowElem.style.background = `radial-gradient(circle at 50% 50%, hsla(${mainHue}, 100%, 55%, 0.18) 0%, hsla(${mainHue}, 100%, 35%, 0.05) 70%, transparent 100%)`;

      // Título estático con color dinámico holográfico
      titleElem.style.color = holoColor;
      titleElem.style.textShadow = `0 0 15px ${holoGlow}, 0 0 30px ${holoGlow}`;

      const cx = canvas.width / 2;
      const cy = canvas.height * 0.42;
      const floatY = Math.sin(time * 2.5) * 12;

      // 1. Haz de Luz Holográfico Proyector Infantil
      const beamGrad = ctx.createLinearGradient(cx, canvas.height, cx, cy - 100);
      beamGrad.addColorStop(0, `hsla(${mainHue}, 100%, 60%, 0.4)`);
      beamGrad.addColorStop(0.5, `hsla(${mainHue}, 100%, 50%, 0.15)`);
      beamGrad.addColorStop(1, `hsla(${mainHue}, 100%, 50%, 0.0)`);

      ctx.fillStyle = beamGrad;
      ctx.beginPath();
      ctx.moveTo(cx - 300, canvas.height);
      ctx.lineTo(cx + 300, canvas.height);
      ctx.lineTo(cx + 180, cy - 100);
      ctx.lineTo(cx - 180, cy - 100);
      ctx.closePath();
      ctx.fill();

      // 2. Partículas Infantiles en forma de Estrellitas
      particles.forEach(p => {
        ctx.save();
        ctx.translate(p.x, p.y);
        ctx.rotate(p.rot);
        drawStar(0, 0, 5, p.size, p.size / 2, `hsla(${mainHue}, 100%, 80%, ${p.alpha})`);
        ctx.restore();
      });

      // 3. Personaje Holográfico Infantil (Estilo Chibi)
      ctx.save();
      ctx.translate(0, floatY);
      ctx.strokeStyle = holoColor;
      ctx.shadowColor = holoGlow;
      ctx.shadowBlur = 22;
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      // --- CORONA INFANTIL ---
      ctx.beginPath();
      ctx.moveTo(cx - 35, cy - 105);
      ctx.lineTo(cx - 45, cy - 135);
      ctx.lineTo(cx - 20, cy - 118);
      ctx.lineTo(cx, cy - 142);
      ctx.lineTo(cx + 20, cy - 118);
      ctx.lineTo(cx + 45, cy - 135);
      ctx.lineTo(cx + 35, cy - 105);
      ctx.closePath();
      ctx.stroke();

      // Gemas de la corona
      [-45, 0, 45].forEach((gx, idx) => {
        const gy = idx === 1 ? cy - 142 : cy - 135;
        ctx.beginPath();
        ctx.arc(cx + gx, gy, 4, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
      });

      // --- CABEZA CHIBI GRANDE Y REDONDA ---
      ctx.beginPath();
      ctx.arc(cx, cy, 80, 0, Math.PI * 2);
      ctx.stroke();

      // Cabello infantil amigable
      ctx.beginPath();
      ctx.arc(cx - 40, cy - 50, 30, Math.PI * 0.8, Math.PI * 1.8);
      ctx.arc(cx, cy - 65, 35, Math.PI * 0.9, Math.PI * 1.9);
      ctx.arc(cx + 40, cy - 50, 30, Math.PI * 1.2, Math.PI * 0.2);
      ctx.stroke();

      // --- MEJILLAS / RUBOR INFANTIL ---
      ctx.fillStyle = `hsla(${mainHue}, 100%, 80%, 0.45)`;
      ctx.beginPath();
      ctx.ellipse(cx - 42, cy + 18, 12, 8, 0, 0, Math.PI * 2);
      ctx.ellipse(cx + 42, cy + 18, 12, 8, 0, 0, Math.PI * 2);
      ctx.fill();

      // --- OJOS GRANDES Y TIERNO ---
      const eyeY = cy - 5;
      const eyeWidth = 22;
      const eyeHeight = lerp(32, 38, animProgress);

      [cx - 32, cx + 32].forEach((ex) => {
        ctx.save();
        ctx.translate(ex, eyeY);
        ctx.scale(1, eyeScaleY);

        // Contorno ojo
        ctx.beginPath();
        ctx.ellipse(0, 0, eyeWidth, eyeHeight, 0, 0, Math.PI * 2);
        ctx.strokeStyle = holoColor;
        ctx.lineWidth = 3;
        ctx.stroke();

        // Pupila rellena
        ctx.beginPath();
        ctx.ellipse(0, 2, eyeWidth - 6, eyeHeight - 8, 0, 0, Math.PI * 2);
        ctx.fillStyle = holoColor;
        ctx.fill();

        // Brillo infantil / Estrellita en el ojo
        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(-6, -8, 6, 0, Math.PI * 2);
        ctx.arc(5, 8, 3, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();

        // Pestaña / Ceja tierna
        const eyebrowY = lerp(cy - 40, cy - 48, animProgress);
        ctx.beginPath();
        ctx.lineWidth = 3.5;
        ctx.arc(ex, eyebrowY, 18, Math.PI * 1.2, Math.PI * 1.8);
        ctx.stroke();
      });

      // --- BOCA INFANTIL SONRIENTE ---
      const mouthY = cy + 28;
      if (animProgress < 0.5) {
        // Enojo juguetón/Infantil (Puchero)
        ctx.beginPath();
        ctx.arc(cx, mouthY + 15, 14, Math.PI * 1.1, Math.PI * 1.9);
        ctx.lineWidth = 4;
        ctx.stroke();
      } else {
        // Sonrisa tierna abierta
        ctx.beginPath();
        ctx.arc(cx, mouthY, 20, 0.1 * Math.PI, 0.9 * Math.PI, false);
        ctx.lineWidth = 4;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(cx, mouthY + 2, 12, 0.1 * Math.PI, 0.9 * Math.PI, false);
        ctx.fillStyle = holoColor;
        ctx.fill();
      }

      // --- CUERPO INFANTIL PEQUEÑO (CUERPO CHIBI) ---
      const bodyY = cy + 80;

      // Vestidito / Ropa redondeada
      ctx.beginPath();
      ctx.moveTo(cx - 20, bodyY);
      ctx.lineTo(cx - 45, bodyY + 80);
      ctx.quadraticCurveTo(cx, bodyY + 95, cx + 45, bodyY + 80);
      ctx.lineTo(cx + 20, bodyY);
      ctx.closePath();
      ctx.stroke();

      // Brazos pequeños saludando
      ctx.beginPath();
      // Brazo izquierdo saludando con varita
      ctx.moveTo(cx - 20, bodyY + 10);
      ctx.lineTo(cx - 55, bodyY + 5);
      ctx.lineTo(cx - 70, bodyY - 20);
      ctx.stroke();

      // Varita mágica infantil
      ctx.beginPath();
      ctx.moveTo(cx - 70, bodyY - 20);
      ctx.lineTo(cx - 85, bodyY - 50);
      ctx.lineWidth = 3;
      ctx.stroke();
      drawStar(cx - 85, cy - 50, 5, 12, 6, '#ffffff');

      // Brazo derecho
      ctx.beginPath();
      ctx.moveTo(cx + 20, bodyY + 10);
      ctx.lineTo(cx + 50, bodyY + 30);
      ctx.lineTo(cx + 60, bodyY + 55);
      ctx.lineWidth = 4;
      ctx.stroke();

      // Pies pequeñitos
      ctx.beginPath();
      ctx.arc(cx - 18, bodyY + 98, 10, 0, Math.PI * 2);
      ctx.arc(cx + 18, bodyY + 98, 10, 0, Math.PI * 2);
      ctx.stroke();

      ctx.restore();

      // 4. Líneas Suaves de Escaneo Holográfico
      ctx.shadowBlur = 0;
      ctx.fillStyle = `rgba(0, 255, 255, 0.03)`;
      for (let i = 0; i < canvas.height; i += 4) {
        ctx.fillRect(0, i, canvas.width, 2);
      }
    }

    function loop() {
      update();
      drawScene();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
