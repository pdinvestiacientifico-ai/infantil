<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Palacio del Rey Agüero - Homenaje</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #020308;
      font-family: 'Segoe UI', Roboto, sans-serif;
      overflow: hidden;
      position: relative;
    }

    /* Resplandor holográfico ambiental */
    .full-page-glow {
      position: absolute;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      transition: background 0.5s ease;
      z-index: 2;
    }

    /* Texto Único: HOMENAJE */
    .title {
      position: absolute;
      top: 35px;
      font-size: 3rem;
      font-weight: 900;
      letter-spacing: 10px;
      text-transform: uppercase;
      transition: color 0.5s ease, text-shadow 0.5s ease;
      z-index: 10;
    }

    #canvas-container {
      position: relative;
      width: 100vw;
      height: 100vh;
      z-index: 5;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>

  <div id="glow" class="full-page-glow"></div>
  <div id="title" class="title">HOMENAJE</div>

  <div id="canvas-container">
    <canvas id="holoCanvas"></canvas>
  </div>

  <script>
    const canvas = document.getElementById('holoCanvas');
    const ctx = canvas.getContext('2d');
    const glowElem = document.getElementById('glow');
    const titleElem = document.getElementById('title');

    // Carga de la imagen de fondo (Interior del castillo)
    const bgImage = new Image();
    let bgLoaded = false;
    bgImage.src = 'https://images.unsplash.com/photo-1541512416146-3cf58d6b27cc?auto=format&fit=crop&w=1920&q=80';
    bgImage.onload = () => {
      bgLoaded = true;
    };

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    let targetState = 'happy';
    let animProgress = 1; // 0 = Angry, 1 = Happy
    let eyeScaleY = 1;
    let blinkTimer = 0;
    let time = 0;

    const particles = Array.from({ length: 60 }, () => ({
      x: Math.random() * window.innerWidth,
      y: Math.random() * window.innerHeight,
      size: Math.random() * 2.5 + 1,
      speedY: Math.random() * 1.2 + 0.4,
      alpha: Math.random()
    }));

    document.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();
      if (key === 'm') targetState = 'angry';
      if (key === 'n') targetState = 'happy';
    });

    function lerp(start, end, amt) {
      return (1 - amt) * start + amt * end;
    }

    function update() {
      time += 0.04;

      if (targetState === 'happy' && animProgress < 1) {
        animProgress += 0.06;
        if (animProgress > 1) animProgress = 1;
      } else if (targetState === 'angry' && animProgress > 0) {
        animProgress -= 0.06;
        if (animProgress < 0) animProgress = 0;
      }

      blinkTimer += 0.025;
      if (blinkTimer > 3) {
        eyeScaleY = Math.abs(Math.sin(blinkTimer * 12));
        if (blinkTimer > 3.25) blinkTimer = 0;
      } else {
        eyeScaleY = 1;
      }

      particles.forEach(p => {
        p.y -= p.speedY;
        if (p.y < 0) {
          p.y = canvas.height;
          p.x = Math.random() * canvas.width;
        }
      });
    }

    // Dibujo del fondo utilizando la fotografía
    function drawCastleImageBackground() {
      const w = canvas.width;
      const h = canvas.height;

      if (bgLoaded) {
        // Escalar la imagen manteniendo proporciones (cover)
        const imgRatio = bgImage.width / bgImage.height;
        const canvasRatio = w / h;
        let renderWidth, renderHeight, offsetX, offsetY;

        if (canvasRatio > imgRatio) {
          renderWidth = w;
          renderHeight = w / imgRatio;
          offsetX = 0;
          offsetY = (h - renderHeight) / 2;
        } else {
          renderWidth = h * imgRatio;
          renderHeight = h;
          offsetX = (w - renderWidth) / 2;
          offsetY = 0;
        }

        ctx.drawImage(bgImage, offsetX, offsetY, renderWidth, renderHeight);

        // Capa oscura ambiental para integrarlo con la holografía
        ctx.fillStyle = 'rgba(5, 4, 10, 0.65)';
        ctx.fillRect(0, 0, w, h);
      } else {
        // Fondo temporal mientras descarga la imagen
        ctx.fillStyle = '#0a0814';
        ctx.fillRect(0, 0, w, h);
      }
    }

    function drawScene() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const mainHue = lerp(340, 185, animProgress); // Magenta/Rojo para M, Cian para N
      const holoColor = `hsl(${mainHue}, 100%, 65%)`;
      const holoGlow = `hsl(${mainHue}, 100%, 50%)`;

      // 1. Fotografía de fondo del Castillo
      drawCastleImageBackground();

      // 2. Resplandor holográfico ambiental
      glowElem.style.background = `radial-gradient(circle at 50% 60%, hsla(${mainHue}, 100%, 45%, 0.35) 0%, hsla(${mainHue}, 100%, 15%, 0.15) 60%, transparent 100%)`;
      titleElem.style.color = holoColor;
      titleElem.style.textShadow = `0 0 15px ${holoGlow}, 0 0 30px ${holoGlow}`;

      const cx = canvas.width / 2;
      const cy = canvas.height * 0.38;
      const floatY = Math.sin(time * 2) * 8;

      // 3. Haz de luz holográfico
      const beamGrad = ctx.createLinearGradient(cx, canvas.height * 0.85, cx, cy - 100);
      beamGrad.addColorStop(0, `hsla(${mainHue}, 100%, 50%, 0.45)`);
      beamGrad.addColorStop(0.7, `hsla(${mainHue}, 100%, 50%, 0.12)`);
      beamGrad.addColorStop(1, `hsla(${mainHue}, 100%, 50%, 0.0)`);

      ctx.fillStyle = beamGrad;
      ctx.beginPath();
      ctx.moveTo(cx - 220, canvas.height * 0.85);
      ctx.lineTo(cx + 220, canvas.height * 0.85);
      ctx.lineTo(cx + 170, cy - 100);
      ctx.lineTo(cx - 170, cy - 100);
      ctx.closePath();
      ctx.fill();

      // Partículas holográficas
      particles.forEach(p => {
        ctx.fillStyle = `hsla(${mainHue}, 100%, 75%, ${p.alpha})`;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
      });

      // 4. PERSONAJE REALISTA HOLOGRÁFICO
      ctx.save();
      ctx.translate(0, floatY);
      ctx.strokeStyle = holoColor;
      ctx.shadowColor = holoGlow;
      ctx.shadowBlur = 18;
      ctx.lineWidth = 2.5;

      const bodyY = cy + 100;

      // -- TORSO REALISTA --
      ctx.beginPath();
      ctx.moveTo(cx - 45, bodyY); ctx.lineTo(cx + 45, bodyY);
      ctx.lineTo(cx + 35, bodyY + 120); ctx.lineTo(cx - 35, bodyY + 120);
      ctx.closePath();
      ctx.stroke();

      // Cuello
      ctx.beginPath();
      ctx.moveTo(cx - 15, bodyY); ctx.lineTo(cx - 15, cy + 85);
      ctx.moveTo(cx + 15, bodyY); ctx.lineTo(cx + 15, cy + 85);
      ctx.stroke();

      // -- BRAZOS REALISTAS CON ARTICULACIONES --
      ctx.beginPath();
      ctx.moveTo(cx - 45, bodyY); ctx.lineTo(cx - 75, bodyY + 65);
      ctx.lineTo(cx - 85, bodyY + 125); ctx.arc(cx - 87, bodyY + 128, 5, 0, Math.PI * 2);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(cx + 45, bodyY); ctx.lineTo(cx + 75, bodyY + 65);
      ctx.lineTo(cx + 85, bodyY + 125); ctx.arc(cx + 87, bodyY + 128, 5, 0, Math.PI * 2);
      ctx.stroke();

      // -- PIERNAS REALISTAS --
      ctx.beginPath();
      ctx.moveTo(cx - 25, bodyY + 120); ctx.lineTo(cx - 30, bodyY + 200); ctx.lineTo(cx - 32, bodyY + 280);
      ctx.stroke();

      ctx.beginPath();
      ctx.moveTo(cx + 25, bodyY + 120); ctx.lineTo(cx + 30, bodyY + 200); ctx.lineTo(cx + 32, bodyY + 280);
      ctx.stroke();

      // -- CABEZA ANATÓMICA PROPORCIONAL --
      ctx.beginPath();
      ctx.moveTo(cx - 60, cy - 30);
      ctx.quadraticCurveTo(cx - 65, cy + 40, cx - 25, cy + 80);
      ctx.lineTo(cx, cy + 90); ctx.lineTo(cx + 25, cy + 80);
      ctx.quadraticCurveTo(cx + 65, cy + 40, cx + 60, cy - 30);
      ctx.quadraticCurveTo(cx, cy - 100, cx - 60, cy - 30);
      ctx.stroke();

      // Cabello
      ctx.beginPath();
      ctx.moveTo(cx - 60, cy - 30);
      ctx.quadraticCurveTo(cx - 30, cy - 95, cx, cy - 70);
      ctx.quadraticCurveTo(cx + 30, cy - 95, cx + 60, cy - 30);
      ctx.stroke();

      // Cejas
      const eyebrowY = lerp(cy - 25, cy - 35, animProgress);
      const eyebrowTilt = lerp(20, -5, animProgress);
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.moveTo(cx - 50, eyebrowY - eyebrowTilt); ctx.lineTo(cx - 15, eyebrowY + eyebrowTilt);
      ctx.moveTo(cx + 15, eyebrowY + eyebrowTilt); ctx.lineTo(cx + 50, eyebrowY - eyebrowTilt);
      ctx.stroke();

      // -- OJOS ANIME CONSERVADOS --
      const eyeY = cy - 2;
      const eyeWidth = 20;
      const eyeHeight = lerp(28, 36, animProgress);

      [cx - 32, cx + 32].forEach((ex) => {
        ctx.save();
        ctx.translate(ex, eyeY);
        ctx.scale(1, eyeScaleY);

        ctx.beginPath();
        ctx.ellipse(0, 0, eyeWidth, eyeHeight, 0, 0, Math.PI * 2);
        ctx.strokeStyle = holoColor;
        ctx.lineWidth = 2;
        ctx.stroke();

        ctx.beginPath();
        ctx.ellipse(0, 2, eyeWidth - 5, eyeHeight - 7, 0, 0, Math.PI * 2);
        ctx.stroke();

        ctx.beginPath();
        ctx.ellipse(0, 4, 5, 9, 0, 0, Math.PI * 2);
        ctx.fillStyle = holoColor;
        ctx.fill();

        ctx.fillStyle = '#ffffff';
        ctx.beginPath();
        ctx.arc(-5, -7, 4.5, 0, Math.PI * 2);
        ctx.arc(4, 7, 2, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();

        ctx.beginPath();
        ctx.lineWidth = 4;
        ctx.arc(ex, eyeY - eyeHeight * eyeScaleY + 5, eyeWidth + 2, Math.PI * 1.1, Math.PI * 1.9);
        ctx.stroke();
      });

      // -- BOCA Y DIENTE MORDIENDO --
      const mouthY = cy + 45;

      if (animProgress < 0.5) {
        const shake = Math.sin(time * 30) * 1.5;

        ctx.beginPath();
        ctx.moveTo(cx - 22 + shake, mouthY);
        ctx.lineTo(cx + 22 + shake, mouthY + 3);
        ctx.lineTo(cx + 14 + shake, mouthY + 16);
        ctx.lineTo(cx - 18 + shake, mouthY + 14);
        ctx.closePath();
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(cx - 7 + shake, mouthY);
        ctx.lineTo(cx - 1 + shake, mouthY);
        ctx.lineTo(cx - 4 + shake, mouthY + 11);
        ctx.closePath();
        ctx.fillStyle = '#ffffff';
        ctx.fill();
        ctx.stroke();
      } else {
        ctx.beginPath();
        ctx.arc(cx, mouthY - 5, 18, 0.2 * Math.PI, 0.8 * Math.PI, false);
        ctx.lineWidth = 3;
        ctx.stroke();
      }

      ctx.restore();

      // Líneas de escaneo holográficas
      ctx.fillStyle = `rgba(0, 0, 0, 0.18)`;
      for (let i = 0; i < canvas.height; i += 4) {
        ctx.fillRect(0, i, canvas.width, 2);
      }
    }

    function loop() {
      update();
      drawScene();
      requestAnimationFrame(loop);
    }

    loop();
  </script>
</body>
</html>
